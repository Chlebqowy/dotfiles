[colors]
background = #aa000000
background-alt = #b0b0b0
foreground = #fafcfb
primary = #75ff98
secondary = #AA75ff98
alert = #A54242
disabled = #298c43

[bar/example-main]
width = 100%
height = 24pt
radius = 0
override-redirect = false

monitor = DP-2

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0pt
border-color = #55298c43

padding-left = 1
padding-right = 1

separator = " ( "
separator-foreground = ${colors.secondary}

font-0 = DepartureMono Nerd Font:size=12
font-1 = DepartureMono Nerd Font:style=Bold:size=12

modules-left = xwindow pkg
modules-center = date
modules-right = filesystem1 pulseaudio memory cpu gpu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xwindow]
type = internal/xwindow
label = "%{F#75ff98}%{T2}%instance%%{F-}%{T0} %title:0:25:...%"

[module/filesystem1]
type = internal/fs
interval = 25

mount-0 = /home

fixed-values = true

format-mounted = %{T2}<ramp-capacity>%{T0} <label-mounted>
label-mounted = %used%/%total%%{F-}

ramp-capacity-0 = "HOME"
ramp-capacity-0-foreground = #f00
ramp-capacity-1 = "HOME"
ramp-capacity-1-foreground = #f33
ramp-capacity-2 = "HOME"
ramp-capacity-2-weight = 2
ramp-capacity-2-foreground = #f55
ramp-capacity-3 = "HOME"
ramp-capacity-3-weight = 3
ramp-capacity-3-foreground = #faa
ramp-capacity-4 = "HOME"
ramp-capacity-4-weight = 12
ramp-capacity-4-foreground = #75ff98

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

click-right = "kitty spf ~"
click-left = "nautilus ~"

[module/filesystem2]
type = internal/fs
interval = 25

mount-0 = /drives/nvmegames

format-mounted = %{T2}<ramp-capacity>%{T0} <label-mounted>
label-mounted = %used%/%total%%{F-}

ramp-capacity-0 = "NVME"
ramp-capacity-0-foreground = #f00
ramp-capacity-1 = "NVME"
ramp-capacity-1-foreground = #f33
ramp-capacity-2 = "NVME"
ramp-capacity-2-weight = 2
ramp-capacity-2-foreground = #f55
ramp-capacity-3 = "NVME"
ramp-capacity-3-weight = 3
ramp-capacity-3-foreground = #faa
ramp-capacity-4 = "NVME"
ramp-capacity-4-weight = 12
ramp-capacity-4-foreground = #75ff98

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

click-right = "kitty spf /drives/nvmegames"
click-left = "nautilus /drives/nvmegames"


[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true

format-volume = %{T2}<ramp-volume>%{T0} <label-volume>
label-volume = %percentage:2%%%{F-}

ramp-volume-0 = VOL 
ramp-volume-0-foreground = #75ff98
ramp-volume-1-weight = 8
ramp-volume-1 = VOL 
ramp-volume-1-foreground = #75ff98
ramp-volume-2-weight = 2
ramp-volume-2 = VOL 
ramp-volume-2-foreground = #faa
ramp-volume-3 = VOL 
ramp-volume-3-foreground = #f55
ramp-volume-4 = VOL 
ramp-volume-4-foreground = #f00
ramp-volume-5 = VOL 
ramp-volume-5-foreground = #f00

label-muted = muted
label-muted-foreground = ${colors.disabled}

click-left = pavucontrol
click-right = qpwgraph
 
[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 0.5
format = %{T2}<ramp-used>%{T0} <label>
label = %percentage_used:2%%%{F-}

ramp-used-0 = RAM
ramp-used-0-foreground = #75ff98
ramp-used-1-weight = 8
ramp-used-1 = RAM
ramp-used-1-foreground = #75ff98
ramp-used-2-weight = 2
ramp-used-2 = RAM
ramp-used-2-foreground = #faa
ramp-used-3 = RAM
ramp-used-3-foreground = #f55
ramp-used-4 = RAM
ramp-used-4-foreground = #f00
ramp-used-5 = RAM
ramp-used-5-foreground = #f00

click-left = kitty ramwise
click-right = kitty htop

[module/cpu]
type = internal/cpu
interval = 0.5

format = %{T2}<ramp-load>%{T0} <label>
label = %percentage:2%%%{F-}

ramp-load-0 = CPU
ramp-load-0-foreground = #75ff98
ramp-load-1-weight = 8
ramp-load-1 = CPU
ramp-load-1-foreground = #75ff98
ramp-load-2-weight = 2
ramp-load-2 = CPU
ramp-load-2-foreground = #faa
ramp-load-3 = CPU
ramp-load-3-foreground = #f55
ramp-load-4 = CPU
ramp-load-4-foreground = #f00
ramp-load-5 = CPU
ramp-load-5-foreground = #f00

click-left = "kitty htop"

[module/gpu]
type = custom/script
exec = chlebqowy-gpu-usage
interval = 0.5
label = %output%%

click-left = "kitty nvidia-smi -l"

[module/pkg]
type = custom/script
exec = chlebqowy-update-num
interval = 5
label = %output%

click-left = "kitty sudo sh -c 'zypper ref; zypper dup; pacman -Syu; apt update; apt upgrade; dnf upgrade --refresh'"

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
label-font = 2
type = internal/date
interval = 1

date-alt = %H:%M
date = %H:%M:%S %Y-%m-%d

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = false

; vim:ft=dosini
