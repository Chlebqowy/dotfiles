<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- Set default monospace font -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Iosevka Nerd Font Mono</string>
    </edit>
  </match>

  <!-- Set default sans-serif (UI + general sans) -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Iosevka Nerd Font</string>
    </edit>
  </match>

  <!-- Set default UI font -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Iosevka Nerd Font</string>
    </edit>
  </match>

  <!-- Set default Flatpak app font -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>Noto Sans</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Iosevka Nerd Font</string>
    </edit>
  </match>

  <!-- Set default Firefox font -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>Inter</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Iosevka Nerd Font</string>
    </edit>
  </match>
<!-- shoutout chatgpt I could not find any other source of information on to do it -->
</fontconfig>
