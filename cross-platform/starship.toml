"$schema" = 'https://starship.rs/config-schema.json'
palette = 'main'
format = """\
[ ](fg:accent)[](fg:accent bg:gray)\
[$directory]()[\\\\](fg:accent bg:gray)\
[$time](bg:gray fg:white_text)[\\\\](fg:accent bg:gray)\
[$sudo](bg:gray fg:white_text)\
[$battery](bg:gray fg:white_text)\
[$rust](bg:gray fg:white_text)\
[$python](bg:gray fg:white_text)\
[$cpp](bg:gray fg:white_text)\
[$c](bg:gray fg:white_text)\
[](fg:accent bg:gray)[](fg:accent)
[   ]()\
[ ](fg:secondary)[](fg:secondary bg:gray)\
[$os](bg:gray fg:white_text)[\\\\](fg:secondary bg:gray)\
[$username](bg:gray fg:white_text)\
[$git_branch](bg:gray fg:white_text)\
[$git_state](bg:gray fg:white_text)\
[$git_metrics](bg:gray fg:white_text)\
[$git_status](bg:gray fg:white_text)\
[](bg:gray fg:secondary)[](fg:secondary)
[](fg:gray)[ ](bg:gray)[$status]()[ ](bg:gray)[](fg:gray) \
"""

[palettes.main]
accent = "#ef8528"
primary = "#ef8528"
secondary = "#2892ef"
gray = "#6f6b60"
white_text = "#e7e3e0"
red_text = "#ffc0c0"
failure = "#ff3322"

[directory]
truncation_length = 3
truncation_symbol = ".../"
style = "fg:white_text bg:gray"
read_only_style = "fg:red_text bg:gray"
format = "[ $path ]($style)"

[time]
disabled = false
use_12hr = true
style = "bg:gray fg:white_text"
format = "[ $time ]($style)"

[battery]
format = "[ $percentage ]($style)"

[[battery.display]]
style = "bg:gray fg:white_text"
threshold=100

[username]
show_always = true
style_user = "fg:white_text bg:gray"
style_root = "fg:red_text"
format = "[ $user ]($style)"

[status]
disabled = false
style = "bg:gray fg:accent"
failure_style = "bg:gray fg:failure"
symbol = "\\$"
success_symbol = "\\$"
#pipestatus = true
#pipestatus_format = "[$pipestatus] => [$common_meaning$signal_name$maybe_int $symbol ]($style)"
format = "[$symbol]($style)"

[git_branch]
truncation_length = 10
truncation_symbol = '...'
format = "[\\\\](fg:secondary bg:gray) [$branch]($style) "
style = "bg:gray fg:white_text"

[git_state]
format = "[\\\\](fg:secondary bg:gray) [$state]($style) [\\\\](fg:secondary bg:gray) [$progress_current/$progress_total]($style)"
style = "bg:gray fg:white_text"

[git_metrics]
disabled = false
format = "[\\\\](fg:secondary bg:gray) [+$added]($added_style) [\\\\](fg:secondary bg:gray) [-$deleted]($added_style) "
added_style = "bg:gray fg:wbite_text"

[git_status]
disabled = false
format = "[\\\\](fg:secondary bg:gray)[$ahead]($style)[$behind]($style)[$up_to_date]($style) [\\\\](fg:secondary bg:gray)[$modified]($style)[$deleted]($style)[$worktree_added]($style) "
style = "bg:gray fg:wbite_text"
ahead = " ⇡${count}"
diverged = " ⇡${ahead_count} ⇣${behind_count}"
behind = " ⇣${count}"
up_to_date = " ="
modified = " M${count}"
deleted = " A${count}"
worktree_added = " D${count}"

[sudo]
disabled = false
format = "[\\\\](fg:primary bg:gray) [sudo]($style)"
style = "bg:gray fg:wbite_text"

[rust]
disabled = false
format = "[\\\\](fg:primary bg:gray) [Rust $version]($style)"
style = "bg:gray fg:wbite_text"

[python]
disabled = false
format = "[\\\\](fg:primary bg:gray) [Python $version]($style)"
style = "bg:gray fg:wbite_text"

[cpp]
disabled = false
format = "[\\\\](fg:primary bg:gray) [C++ $version]($style)"
style = "bg:gray fg:wbite_text"

[c]
disabled = false
format = "[\\\\](fg:primary bg:gray) [C $version]($style)"
style = "bg:gray fg:wbite_text"

[os]
disabled = false
style = "fg:accent_text bg:gray"
format = "[ $symbol]($style)"

