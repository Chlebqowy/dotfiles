"$schema" = 'https://starship.rs/config-schema.json'
palette = 'refreshedi3'
format = "[ ](fg:accent)[█](fg:accent bg:gray)[$directory]()[](fg:accent bg:gray)[$time](bg:gray fg:white_text)[](fg:accent bg:gray)[ ](fg:dark_accent bg:gray)[█](fg:dark_accent)\n[$os](fg:white_text)[$username](fg:white_text) [](fg:gray)[$status](bg:gray fg:success)[](fg:gray)"

[palettes.sideuser]
accent = "#92cf9c"
dark_accent = "#294233"
gray = "#3e3e3e"
white_text = "#e0e0e0"
red_text = "#ffe0e0"
failure = "#fda1a0"
success = "#92cf9c"

[palettes.refreshedi3]
accent = "#75ff98"
dark_accent = "#3f8f62"
gray = "#5b5757"
white_text = "#e0e0e0"
red_text = "#ffc0c0"
failure = "#ff7575"
success = "#75ff98"

[directory]
truncation_length = 3
truncation_symbol = ".../"
style = "fg:white_text bg:gray"
read_only_style = "fg:red_text bg:gray"
format = "[ $path ]($style)"

[time]
disabled = false
use_12hr = true
style = "bg:gray fg:white_text"
format = "[ $time ]($style)"

[username]
show_always = true
style_user = "fg:accent"
style_root = "fg:red_text"
format = "[$user]($style)"

[status]
disabled = false
style = "bg:gray fg:success"
failure_style = "bg:gray fg:failure"
symbol = "\\$"
success_symbol = "\\$"
#pipestatus = true
#pipestatus_format = "[$pipestatus] => [$common_meaning$signal_name$maybe_int $symbol ]($style)"
format = "[$symbol]($style)"

[os]
disabled = false
style = "fg:accent"
format = "[$symbol]($style)"

[os.symbols]
openSUSE = " "
