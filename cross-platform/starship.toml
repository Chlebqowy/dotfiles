"$schema" = 'https://starship.rs/config-schema.json'
palette = 'main'
format = """\
[ ](fg:accent)[](fg:accent bg:gray)\
[$directory]()[\\\\](fg:accent bg:gray)\
[$time](bg:gray fg:white_text)\
[](fg:accent bg:gray)[](fg:accent)
[   ]()\
[ ](fg:accent)[](fg:accent bg:gray)\
[$os](bg:gray fg:white_text)[\\\\](fg:accent bg:gray)\
[$username](bg:gray fg:white_text)\
[](bg:gray fg:accent)[](fg:accent)
[](fg:gray)[ ](bg:gray)[$status]()[ ](bg:gray)[](fg:gray) \
"""

[palettes.main]
accent = "#ef8528"
gray = "#6f6b60"
white_text = "#e7e3e0"
red_text = "#ffc0c0"
failure = "#ff3322"

[directory]
truncation_length = 3
truncation_symbol = ".../"
style = "fg:white_text bg:gray"
read_only_style = "fg:red_text bg:gray"
format = "[ $path ]($style)"

[time]
disabled = false
use_12hr = true
style = "bg:gray fg:white_text"
format = "[ $time ]($style)"

[username]
show_always = true
style_user = "fg:white_text bg:gray"
style_root = "fg:red_text"
format = "[ $user ]($style)"

[status]
disabled = false
style = "bg:gray fg:accent"
failure_style = "bg:gray fg:failure"
symbol = "\\$"
success_symbol = "\\$"
#pipestatus = true
#pipestatus_format = "[$pipestatus] => [$common_meaning$signal_name$maybe_int $symbol ]($style)"
format = "[$symbol]($style)"

[os]
disabled = false
style = "fg:accent_text bg:gray"
format = "[ $symbol]($style)"

