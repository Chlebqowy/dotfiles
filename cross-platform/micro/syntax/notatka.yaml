filetype: notatka
detect:
    filename: "\\.n$"

rules:
    - symbol.operator: "([.:;,+*\\%=!<>/\\-&])"
    - type: "\\|"
    - symbol.brackets: "[(){}]|\\[|\\]"
    - constant.number: "\\b[0123456789/]+(\\.[0123456789/]+)?([Ee][+-]?[0-9]+)?\\b"
    - special: "^#{1,6}.*"
    - comment:
        start: "<--"
        end: "-->"
        rules:
            - todo: "(ZDOM):?"
