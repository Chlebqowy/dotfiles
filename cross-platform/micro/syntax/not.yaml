filetype: not
detect:
    filename: "\\.not$"

rules:
    - symbol.operator: "([.:;,+*\\%=!<>/\\-&])"
    - type: "\\|"
    - symbol.brackets: "[(){}]|\\[|\\]"
    - constant.number: "\\b[0-9]+(\\.[0-9]+)?([Ee][+-]?[0-9]+)?\\b"
    - comment:
        start: "<--"
        end: "-->"
        rules:
            - todo: "(ZDOM):?"
