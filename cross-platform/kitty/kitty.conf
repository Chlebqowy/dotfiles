# all useless parts of this config have been removed
# find docs elsewhere

font_size 16
font_features +smcp
foreground #ffffff
background #222222
background_blur 1

# BEGIN_KITTY_FONTS
font_family      family='DepartureMono Nerd Font Mono' postscript_name=DepartureMonoNFM-Regular
bold_font        family='DepartureMono Nerd Font Mono' features=+smcp
italic_font      family='Literation Mono Nerd Font'
bold_italic_font family='Literation Mono Nerd Font'
# END_KITTY_FONTS

map ctrl+shift+left no_op
map ctrl+shift+right no_op
